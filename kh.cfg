# ld65 linker configuration -- LoROM, FastROM, 256 KiB (8 x 32 KiB banks)
#
# LoROM maps the upper half of each bank ($8000-$FFFF) to a 32 KiB slice of the
# ROM file. We use the $80+ bank mirror so FastROM (3.58 MHz) applies.
#
#   bank $80  $8000-$FFAF   code                      file $000000-$007FAF
#             $FFB0-$FFFF   cartridge header+vectors  file $007FB0-$007FFF
#   bank $81  $8000-$FFFF   background graphics       file $008000-$00FFFF
#   bank $82  $8000-$FFFF   sprite graphics           file $010000-$017FFF
#   bank $83  $8000-$FFFF   maps + palettes           file $018000-$01FFFF
#   bank $84+ $8000-$FFFF   spare
#
# WRAM low 8 KiB ($0000-$1FFF) is mirrored into banks $80-$BF, so the engine
# reaches all of its state with fast direct-page / absolute addressing.

MEMORY {
    # --- RAM (never written to the ROM file) --------------------------------
    ZP:     start = $000000, size = $0100, type = rw, define = yes, file = "";
    BSS:    start = $000200, size = $1600, type = rw, define = yes, file = "";
    STACK:  start = $001800, size = $07FF, type = rw, define = yes, file = "";

    # --- ROM ----------------------------------------------------------------
    ROM0:   start = $808000, size = $7FB0, type = ro, file = %O, fill = yes, fillval = $00;
    HDR:    start = $80FFB0, size = $0050, type = ro, file = %O, fill = yes, fillval = $00;
    ROM1:   start = $818000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM2:   start = $828000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM3:   start = $838000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM4:   start = $848000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM5:   start = $858000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM6:   start = $868000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM7:   start = $878000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE:   load = ZP,   type = zp,  optional = yes;
    BSS:        load = BSS,  type = bss, optional = yes;

    CODE:       load = ROM0, type = ro;
    RODATA:     load = ROM0, type = ro,  optional = yes;
    SNESHEADER: load = HDR,  type = ro;

    GFXBG:      load = ROM1, type = ro,  optional = yes;
    GFXOBJ:     load = ROM2, type = ro,  optional = yes;
    MAPDATA:    load = ROM3, type = ro,  optional = yes;
    GFXSORA:    load = ROM4, type = ro,  optional = yes;
}

SYMBOLS {
    __STACK_TOP__: type = weak, value = $001FFF;
}
